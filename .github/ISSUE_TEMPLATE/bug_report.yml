name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Dynamic Island version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 1920×1080 at 125 %, two monitors
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Attach the latest file from `%LOCALAPPDATA%\DynamicIsland\logs` (it contains no track titles or task texts).
