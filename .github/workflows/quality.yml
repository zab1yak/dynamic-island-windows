name: Post-0.3.1 quality checks

on:
  push:
    branches: [work/0.3.2]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.*"
      - "global.json"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: X64
          - os: windows-11-arm
            arch: Arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DI_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Windows tests, typography and production page renders
        shell: pwsh
        run: |
          $env:DI_TYPOGRAPHY_SCREENSHOTS = Join-Path $env:RUNNER_TEMP 'typography'
          $env:DI_LAYOUT_SCREENSHOTS = Join-Path $env:RUNNER_TEMP 'layout'
          dotnet test -c Release
      - name: Actual island window, transparency timeline and page matrix
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet run --project tests/DynamicIsland.Visual.QA -c Release -- --output "${{ runner.temp }}/visual-qa"
      - name: Install pinned models and verify native offline engine
        if: ${{ !cancelled() }}
        env:
          DI_OFFLINE_METRICS: ${{ runner.temp }}/offline-metrics/install.json
        run: dotnet run --project tests/DynamicIsland.Offline.Smoke -c Release -- "${{ runner.temp }}/offline-models" --install
      - name: Verify translation with HTTP forbidden
        if: ${{ !cancelled() }}
        env:
          DI_OFFLINE_METRICS: ${{ runner.temp }}/offline-metrics/offline.json
        run: dotnet run --project tests/DynamicIsland.Offline.Smoke -c Release --no-build -- "${{ runner.temp }}/offline-models"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Typography-and-layout-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/typography/
            ${{ runner.temp }}/layout/
            ${{ runner.temp }}/visual-qa/
            ${{ runner.temp }}/offline-metrics/
          if-no-files-found: warn
          retention-days: 14
