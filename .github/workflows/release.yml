name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - Directory.Build.props
      - .github/workflows/release.yml

permissions:
  contents: write

env:
  PACK_ID: DynamicIslandForWindows
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version without recreating existing releases
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, re, subprocess, xml.etree.ElementTree as ET
          version = ET.parse("Directory.Build.props").findtext(".//Version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version or ""):
              raise SystemExit("Release version must be major.minor.patch")
          tag = "v" + version
          tagged = os.environ["GITHUB_REF_TYPE"] == "tag"
          if tagged and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Tag and project version differ")
          exists = subprocess.run(["git", "rev-parse", "--verify", "refs/tags/" + tag], capture_output=True).returncode == 0
          release = subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"], capture_output=True, text=True)
          if release.returncode == 0:
              unpublished = json.loads(release.stdout)["draft"]
          elif "404" in release.stderr:
              unpublished = True
          else:
              raise SystemExit("Could not verify existing GitHub release: " + release.stderr)
          publish = tagged or not exists or unpublished
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag={tag}\npublish={str(publish).lower()}\ntag_exists={str(exists).lower()}\n")

  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release

  tag:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag the tested version
        if: github.ref_type != 'tag' && needs.version.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

  release:
    needs: [version, test, tag]
    runs-on: windows-latest
    strategy:
      max-parallel: 1 # both architectures publish into the same GitHub release
      matrix:
        include:
          - rid: win-x64
            channel: win
            framework: vcredist143-x64
          - rid: win-arm64
            channel: win-arm64
            framework: vcredist143-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained)
        run: >
          dotnet publish src/DynamicIsland.App -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishReadyToRun=true -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish/${{ matrix.rid }}

      - name: Restore vpk
        run: dotnet tool restore

      - name: Verify native architecture and bundled sounds
        shell: pwsh
        run: ./scripts/Verify-CandidatePackage.ps1 -PublishDirectory artifacts/publish/${{ matrix.rid }} -RuntimeIdentifier ${{ matrix.rid }}

      - name: Download previous release (for delta updates)
        continue-on-error: true
        run: >
          dotnet vpk download github --repoUrl ${{ env.REPO_URL }} --channel ${{ matrix.channel }}
          --outputDir artifacts/releases --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        run: >
          dotnet vpk pack --packId ${{ env.PACK_ID }} --packVersion ${{ steps.version.outputs.version }}
          --packDir artifacts/publish/${{ matrix.rid }} --mainExe DynamicIsland.exe
          --packTitle "Dynamic Island" --packAuthors zab1yak
          --icon src/DynamicIsland.App/Assets/island.ico
          --channel ${{ matrix.channel }} --runtime ${{ matrix.rid }}
          --framework ${{ matrix.framework }} --outputDir artifacts/releases

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet vpk upload github --repoUrl $env:REPO_URL --channel ${{ matrix.channel }} `
              --outputDir artifacts/releases --publish --merge `
              --releaseName "Dynamic Island ${{ steps.version.outputs.version }}" --tag ${{ needs.version.outputs.tag }} `
              --token $env:GH_TOKEN
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (3 * $attempt)
          }

      - name: Attach release notes
        if: matrix.rid == 'win-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: pwsh
        run: |
          $notes = "docs/RELEASE_NOTES_${{ needs.version.outputs.version }}.md"
          if (Test-Path $notes) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release edit $env:RELEASE_TAG --repo $env:REPO_URL --notes-file $notes
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($attempt -eq 3) { exit $LASTEXITCODE }
              Start-Sleep -Seconds (3 * $attempt)
            }
          }
